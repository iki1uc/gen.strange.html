:root {
  --bg: #04060d;
  --surface: #080d1a;
  --panel: #0b1224;
  --ink: #e9eefc;
  --muted: #8fa1c7;
  --glow: #5eead4;
  --violet: #c4b5fd;
  --moon: #f2f0e4;
  --line: rgba(148, 178, 255, 0.16);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #04060d;
    --surface: #080d1a;
    --panel: #0b1224;
    --ink: #e9eefc;
    --muted: #8fa1c7;
    --glow: #5eead4;
    --violet: #c4b5fd;
    --moon: #f2f0e4;
    --line: rgba(148, 178, 255, 0.16);
  }
}
html {
  scroll-behavior: smooth;
}
body {
  background: var(--bg);
  color: var(--ink);
}
.font-display {
  font-family: 'Space Grotesk', ui-sans-serif, system-ui, sans-serif;
}
.font-code {
  font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, monospace;
}
@keyframes twinkle {
  0%, 100% {
    opacity: 0.2;
  }
  50% {
    opacity: 1;
  }
}
@keyframes rainFall {
  from {
    transform: translateY(-360px);
  }
  to {
    transform: translateY(6600px);
  }
}
@keyframes pulseGlow {
  0%, 100% {
    box-shadow: 0 0 34px 6px rgba(94, 234, 212, 0.45), 0 0 90px 30px rgba(196, 181, 253, 0.18);
  }
  50% {
    box-shadow: 0 0 56px 16px rgba(94, 234, 212, 0.72), 0 0 140px 54px rgba(196, 181, 253, 0.3);
  }
}
@keyframes floatY {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}
.animate-twinkle {
  animation: twinkle 3.4s ease-in-out infinite;
}
.animate-pulse-glow {
  animation: pulseGlow 4.5s ease-in-out infinite;
}
.animate-float-y {
  animation: floatY 7s ease-in-out infinite;
}
.text-outline {
  -webkit-text-stroke: 1px rgba(233, 238, 252, 0.3);
  color: transparent;
}
